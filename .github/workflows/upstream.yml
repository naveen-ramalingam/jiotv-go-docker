name: Check upstream stable release
'on':
  schedule:
    - cron: '45 22 * * 6' # Sunday 04:15 IST / Saturday 22:45 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Discover stable upstream release and dispatch versioned build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_upstream.py
