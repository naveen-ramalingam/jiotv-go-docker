name: Build and publish image
'on':
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (must contain the intended VERSION)'
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: container-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream: ${{ steps.meta.outputs.upstream }}
      image: ${{ steps.meta.outputs.image }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: |
          sh -n docker/entrypoint.sh
          sh -n docker/healthcheck.sh
          docker compose --env-file .env.example config --quiet
      - name: Validate release version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REQUIRE_TAG: '1'
        run: python3 scripts/release_metadata.py
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image for runtime checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jiotv-go-ci:smoke
          build-args: |
            PACKAGE_VERSION=${{ needs.validate.outputs.version }}
            UPSTREAM_VERSION=${{ needs.validate.outputs.upstream }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check HTTPS, non-root process, and persisted data
        run: python3 scripts/smoke_test.py jiotv-go-ci:smoke
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 and AMD64 images on GitHub
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.image }}:latest
          build-args: |
            PACKAGE_VERSION=${{ needs.validate.outputs.version }}
            UPSTREAM_VERSION=${{ needs.validate.outputs.upstream }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release with image digest and deployment files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/create_release.py
